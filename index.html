<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রান্নার হিসাব ও তালিকা</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #d0e1fd 100%);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ✨ অ্যাকর্ডিয়ন / ড্রপডাউন মেনু বাটন ✨ */
        .main-toggle-btn {
            width: 100%;
            max-width: 750px;
            background: #1a237e;
            color: white;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .main-toggle-btn:hover {
            background: #283593;
        }

        /* মূল স্মার্ট কার্ড container */
        .app-card {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(26, 35, 126, 0.12);
            overflow: hidden;
            margin: 15px auto;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* ফর্মের কার্ড - যা লুকানো থাকবে */
        #appCard {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        /* টেবিলের কার্ড - যা সবসময় দৃশ্যমান থাকবে */
        .table-card {
            display: block;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ফর্ম সেকশন */
        .form-section {
            padding: 25px 20px;
            background: #ffffff;
        }

        .app-title {
            text-align: center;
            color: #1a237e;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 576px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
            .full-width {
                grid-column: span 2;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="datetime-local"], input[type="number"], select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            color: #1f2937;
            background-color: #f9fafb;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #3f51b5;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.15);
        }

        .name-wrapper {
            display: flex;
            gap: 8px;
        }

        .manage-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 0 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .manage-btn:hover {
            background-color: #0369a1;
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3f51b5 0%, #283593 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(63, 81, 181, 0.3);
            margin-top: 5px;
        }

        button.submit-btn:active {
            transform: scale(0.99);
        }

        button.submit-btn:hover {
            box-shadow: 0 6px 16px rgba(63, 81, 181, 0.4);
        }

        /* ✨ ট্রান্সপারেন্ট টেবিল সেকশন ✨ */
        .table-section {
            background: transparent;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            min-width: 100%;
            table-layout: fixed;
            background: transparent;
        }

        th {
            background-color: rgba(239, 68, 68, 0.08);
            color: #dc2626;
            padding: 12px 4px;
            font-size: 13px;
            font-weight: 800;
            border-bottom: 1.5px solid #e5e7eb;
            border-right: 1px solid #f3f4f6;
            word-wrap: break-word;
        }

        th:last-child {
            border-right: none;
        }

        td {
            padding: 12px 4px;
            font-size: 12px;
            color: #374151;
            border-bottom: 1px solid #f3f4f6;
            border-right: 1px solid #f3f4f6;
            background-color: transparent;
            word-wrap: break-word;
        }

        td:last-child {
            border-right: none;
        }

        tr:nth-child(even) td {
            background-color: rgba(243, 244, 246, 0.5);
        }

        tr:hover td {
            background-color: rgba(224, 231, 255, 0.4);
        }

        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background-color: #dc2626;
        }
        
        /* গ্যাপ রো স্টাইল (সাইকেল শেষ হওয়ার পর) */
        .gap-row td {
            background-color: #f59e0b !important;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 0.5px;
            padding: 8px;
        }

        /* মোডাল স্টাইল */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: white;
            padding: 22px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
        }
        
        .setup-section {
            background: #f9fafb;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #e5e7eb;
        }

        .name-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: 600;
        }

        .btn-edit { background: #f59e0b; }
        .btn-del { background: #ef4444; }
        .btn-save { background: #3f51b5; width: 100%; padding: 8px; margin-top: 8px; font-size: 12px; }
        .btn-add { background: #10b981; width: 100%; padding: 10px; margin-top: 12px; font-weight: 700; font-size: 13px; }
        .btn-close { background: #6b7280; width: 100%; padding: 10px; margin-top: 6px; font-weight: 700; font-size: 13px; }

        select option {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ড্রপডাউন বাটন (শুধুমাত্র ফর্মের জন্য) -->
    <button class="main-toggle-btn" onclick="toggleApp()">
        <span>রান্নার এন্ট্রি ফর্ম</span>
        <span id="toggleIcon">▼</span>
    </button>

    <!-- লুকানো ফর্ম কার্ড -->
    <div class="app-card" id="appCard">
        <div class="form-section">
            <h2 class="app-title">নতুন রান্নার হিসাব</h2>
            
            <form id="cookingForm">
                <div class="form-grid">
                    
                    <div class="form-group full-width">
                        <label for="dateTime">তারিখ ও সময়:</label>
                        <input type="datetime-local" id="dateTime" readonly style="background-color: #f3f4f6; cursor: not-allowed;">
                    </div>

                    <div class="form-group">
                        <label for="cookStatus">রান্না হ্যাঁ/না:</label>
                        <select id="cookStatus" required>
                            <option value="">নির্বাচন করুন</option>
                            <option value="হ্যাঁ">হ্যাঁ</option>
                            <option value="না">না</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="day">বার:</label>
                        <select id="day" required>
                            <option value="">বার নির্বাচন করুন</option>
                            <option value="শনিবার">শনিবার</option>
                            <option value="রবিবার">রবিবার</option>
                            <option value="সোমবার">সোমবার</option>
                            <option value="মঙ্গলবার">মঙ্গলবার</option>
                            <option value="বুধবার">বুধবার</option>
                            <option value="বৃহস্পতিবার">বৃহস্পতিবার</option>
                            <option value="শুক্রবার">শুক্রবার</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="nameSelect">নাম:</label>
                        <div class="name-wrapper">
                            <select id="nameSelect" required>
                                <option value="">নাম নির্বাচন করুন</option>
                            </select>
                            <button type="button" class="manage-btn" onclick="openNameManager()">নাম সাজান ⚙️</button>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit" id="submitBtn" class="submit-btn">ডাটা যোগ করুন</button>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!-- সবসময় দৃশ্যমান টেবিল কার্ড -->
    <div class="app-card table-card">
        <div class="table-section">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th style="width: 35%;">তারিখ</th>
                        <th style="width: 27%;">রান্না হ্যাঁ/না</th>
                        <th style="width: 18%;">নাম</th>
                        <th style="width: 20%;">অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- ডাটাবেস থেকে তথ্য লোড হবে -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- নাম ও সাইকেল ম্যানেজ করার মোডাল -->
    <div id="nameModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; text-align:center; color:#1a237e; margin-bottom: 15px;">সেটিংস প্যানেল</h3>
            
            <!-- সাইকেল সেটআপ (ডাইনামিক গ্যাপ এবং লাল রঙের জন্য) -->
            <div class="setup-section">
                <label style="font-size: 13px; font-weight: 700; color: #374151;">সাইকেলের দিন (১-১৫):</label>
                <input type="number" id="cycleDurationInput" min="1" max="15" value="6">
                <button type="button" class="btn-sm btn-save" onclick="saveCycleDuration()">সেভ করুন</button>
            </div>

            <h4 style="color: #374151; border-bottom: 1px solid #ccc; padding-bottom: 5px;">নামের তালিকা</h4>
            <div id="nameListContainer" style="max-height: 200px; overflow-y: auto; margin-top: 10px;"></div>
            
            <button type="button" class="btn-sm btn-add" onclick="addNewName()">+ নতুন নাম যোগ করুন</button>
            <button type="button" class="btn-close" onclick="closeNameManager()">বন্ধ করুন</button>
        </div>
    </div>

    <!-- FIREBASE SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCzssLwY4H2_qZbpeCdF-tD2Fadjv7hkjA",
            authDomain: "bazar-5642d.firebaseapp.com",
            projectId: "bazar-5642d",
            storageBucket: "bazar-5642d.firebasestorage.app",
            messagingSenderId: "459845763211",
            appId: "1:459845763211:web:80c9983f984374186a948e",
            measurementId: "G-Q5WJCPVE9C"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 🔒 সিকিউরিটি পাসওয়ার্ড
        const MASTER_PASSWORD = "123";

        // ডিফল্ট নামের তালিকা ও সাইকেল ডিউরেশন
        let names = JSON.parse(localStorage.getItem('cookingNames')) || ['রবি', 'নাদিম', 'সাদিক', 'তানজিল', 'বশির'];
        let cycleDuration = parseInt(localStorage.getItem('cookingCycleDuration')) || 6;
        let allRecords = []; 

        const cookingForm = document.getElementById('cookingForm');
        const tableBody = document.querySelector('#dataTable tbody');
        const nameSelect = document.getElementById('nameSelect');
        const appCard = document.getElementById('appCard');
        const toggleIcon = document.getElementById('toggleIcon');

        window.onload = function() {
            setInitialDateTime();
            renderNameDropdown();
        };

        // ড্রপডাউন (অ্যাকর্ডিয়ন) টগল ফাংশন
        function toggleApp() {
            if (appCard.style.display === "none" || appCard.style.display === "") {
                appCard.style.display = "block";
                toggleIcon.innerText = "▲";
            } else {
                appCard.style.display = "none";
                toggleIcon.innerText = "▼";
            }
        }

        function setInitialDateTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('dateTime').value = now.toISOString().slice(0, 16);
        }

        function renderNameDropdown() {
            nameSelect.innerHTML = '<option value="" style="color: black;">নাম নির্বাচন করুন</option>';
            const now = new Date();

            names.forEach(name => {
                const lastCooked = allRecords.find(record => record.name === name && record.cookStatus === 'হ্যাঁ');
                let isRed = false;

                if (lastCooked && lastCooked.createdAt) {
                    const lastDate = lastCooked.createdAt.toDate();
                    const diffTime = Math.abs(now - lastDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    if(diffDays > cycleDuration) {
                        isRed = true;
                    }
                } else if (!lastCooked && allRecords.length > 0) {
                    isRed = true;
                }

                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                
                if (isRed) {
                    opt.style.color = '#ef4444';
                } else {
                    opt.style.color = '#1f2937'; 
                }
                
                nameSelect.appendChild(opt);
            });
            localStorage.setItem('cookingNames', JSON.stringify(names));
        }

        function authenticate() {
            const pass = prompt("অ্যাক্সেস করতে পাসওয়ার্ড টাইপ করুন:");
            if (pass === MASTER_PASSWORD) {
                return true;
            } else if (pass !== null) {
                alert("ভুল পাসওয়ার্ড!");
            }
            return false;
        }

        function openNameManager() {
            if (!authenticate()) return;
            document.getElementById('cycleDurationInput').value = cycleDuration;
            renderNameList();
            document.getElementById('nameModal').style.display = 'flex';
        }

        function closeNameManager() {
            document.getElementById('nameModal').style.display = 'none';
            renderNameDropdown();
        }
        
        function saveCycleDuration() {
            const val = parseInt(document.getElementById('cycleDurationInput').value);
            if(val >= 1 && val <= 15) {
                cycleDuration = val;
                localStorage.setItem('cookingCycleDuration', cycleDuration);
                alert(`সাইকেল ${cycleDuration} দিনের জন্য সেট করা হয়েছে!`);
                renderTableData(allRecords); 
                renderNameDropdown(); 
            } else {
                alert("দয়া করে ১ থেকে ১৫ এর মধ্যে একটি সংখ্যা দিন।");
            }
        }

        function renderNameList() {
            const container = document.getElementById('nameListContainer');
            container.innerHTML = '';
            names.forEach((name, index) => {
                const div = document.createElement('div');
                div.className = 'name-item';
                div.innerHTML = `
                    <span>${name}</span>
                    <div>
                        <button class="btn-sm btn-edit" onclick="renameName(${index})">Edit</button>
                        <button class="btn-sm btn-del" onclick="deleteName(${index})">Delete</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function addNewName() {
            const newName = prompt("নতুন নাম লিখুন:");
            if (newName && newName.trim() !== "") {
                names.push(newName.trim());
                renderNameList();
            }
        }

        function renameName(index) {
            const updatedName = prompt("নাম পরিবর্তন করুন:", names[index]);
            if (updatedName && updatedName.trim() !== "") {
                names[index] = updatedName.trim();
                renderNameList();
            }
        }

        function deleteName(index) {
            if (confirm(`আপনি কি "${names[index]}" নাম মুছে ফেলতে চান?`)) {
                names.splice(index, 1);
                renderNameList();
            }
        }

        cookingForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = 'সেভ হচ্ছে...';
            submitBtn.disabled = true;

            const cookStatusInput = document.getElementById('cookStatus').value;
            const dayInput = document.getElementById('day').value;
            const selectedName = nameSelect.value;

            const dateObj = new Date();
            const formattedDate = dateObj.toLocaleDateString('en-GB') + ' ' + 
                                  dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

            try {
                await db.collection('cooking_sheet_records').add({
                    formattedDate: formattedDate,
                    cookStatus: cookStatusInput,
                    day: dayInput,
                    name: selectedName,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                cookingForm.reset();
                setInitialDateTime();

            } catch (error) {
                alert('ডাটা সেভ করতে সমস্যা হয়েছে: ' + error.message);
            } finally {
                submitBtn.innerText = 'ডাটা যোগ করুন';
                submitBtn.disabled = false;
            }
        });

        function renderTableData(records) {
            tableBody.innerHTML = '';

            if (records.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" style="color: #6b7280; padding: 20px;">কোন তথ্য পাওয়া যায়নি</td></tr>`;
                return;
            }

            let entryCount = 0;

            records.forEach((data, index) => {
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td>${data.formattedDate || '-'}</td>
                    <td>${data.day ? data.day + ' (' + data.cookStatus + ')' : data.cookStatus}</td>
                    <td>${data.name}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteRecord('${data.id}')">ডিলিট</button>
                    </td>
                `;
                tableBody.appendChild(row);

                entryCount++;
                
                if (entryCount % cycleDuration === 0 && entryCount !== records.length) {
                    const gapRow = document.createElement('tr');
                    gapRow.className = 'gap-row';
                    gapRow.innerHTML = `<td colspan="4">--- ${cycleDuration} দিনের সাইকেল সম্পন্ন ---</td>`;
                    tableBody.appendChild(gapRow);
                }
            });
        }

        db.collection('cooking_sheet_records')
          .orderBy('createdAt', 'desc')
          .onSnapshot((snapshot) => {
              allRecords = [];
              snapshot.forEach((doc) => {
                  let docData = doc.data();
                  docData.id = doc.id; 
                  allRecords.push(docData);
              });
              
              renderTableData(allRecords);
              renderNameDropdown(); 
          }, (error) => {
              console.error("ডাটা লোড করতে সমস্যা: ", error);
          });

        async function deleteRecord(id) {
            if (authenticate()) {
                try {
                    await db.collection('cooking_sheet_records').doc(id).delete();
                    alert('ডাটা সফলভাবে ডিলিট হয়েছে!');
                } catch (error) {
